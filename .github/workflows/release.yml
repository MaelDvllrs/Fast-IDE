# Publication d'une version de Fast : à chaque tag vX.Y.Z, compile Windows et
# macOS, signe les fichiers de mise à jour et crée la release GitHub avec
# latest.json, que l'app lit au lancement pour se mettre à jour.
#
# Secrets du dépôt (Settings → Secrets and variables → Actions) :
#   TAURI_SIGNING_PRIVATE_KEY           contenu de ~/.tauri/fast-updater.key
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  mot de passe de la clé (vide ici)
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # Un tag dont la version ne correspond pas publierait l'ancienne version sous
      # un nouveau nom (et sans latest.json valable) : on s'arrête tout de suite.
      - name: Check that the version matches the tag
        shell: bash
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME but the app version is $version. Run: npm run version:set ${GITHUB_REF_NAME#v}"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Fast ${{ github.ref_name }}"
          releaseBody: "See the changes below. Fast updates itself at launch."
          releaseDraft: false
          prerelease: false
          # latest.json : la description de la version, lue par l'app pour se mettre à jour.
          includeUpdaterJson: true
          args: ${{ matrix.args }}
